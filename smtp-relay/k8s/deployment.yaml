apiVersion: apps/v1
kind: Deployment
metadata:
  name: uim-smtp-relay-service
  namespace: uim-smtp-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uim-smtp-relay-service
  template:
    metadata:
      labels:
        app: uim-smtp-relay-service
    spec:
      containers:
      - name: smtp-relay
        image: uim-smtp-relay-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: smtp-relay-config
        volumeMounts:
        - name: smtp-relay-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: smtp-relay-data
        emptyDir: {}
