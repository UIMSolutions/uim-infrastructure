apiVersion: v1
kind: Pod
metadata:
  name: uim-smtp-relay-local
spec:
  containers:
  - name: smtp-relay
    image: localhost/uim-smtp-relay-service:dev
    ports:
    - containerPort: 8080
      hostPort: 8080
    env:
    - name: PORT
      value: "8080"
    - name: BIND_ADDRESS
      value: "0.0.0.0"
    - name: PID_FILE
      value: "/tmp/uim-smtp-relay-service.pid"
    - name: SMTP_HOST
      value: "127.0.0.1"
    - name: SMTP_PORT
      value: "1025"
    - name: SMTP_FROM
      value: "noreply@uim.local"
    - name: SMTP_SECURITY
      value: "plain"
    - name: SMTP_AUTH
      value: "none"
    - name: MESSAGE_STORE_PATH
      value: "/tmp/messages.json"
  - name: mailhog
    image: docker.io/mailhog/mailhog:latest
    ports:
    - containerPort: 1025
      hostPort: 1025
    - containerPort: 8025
      hostPort: 8025
