apiVersion: apps/v1
kind: Deployment
metadata:
  name: uim-hts-service
  namespace: uim-hts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uim-hts-service
  template:
    metadata:
      labels:
        app: uim-hts-service
    spec:
      containers:
      - name: hts-service
        image: uim-hts-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: hts-service-config
        volumeMounts:
        - name: unix-auth-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: unix-auth-data
        emptyDir: {}
