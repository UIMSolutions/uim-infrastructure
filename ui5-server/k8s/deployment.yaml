apiVersion: apps/v1
kind: Deployment
metadata:
  name: uim-ui5-server-service
  namespace: uim-ui5-server
  labels:
    app: uim-ui5-server-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uim-ui5-server-service
  template:
    metadata:
      labels:
        app: uim-ui5-server-service
    spec:
      containers:
      - name: uim-ui5-server-service
        image: uim-ui5-server-service:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: uim-ui5-server-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
