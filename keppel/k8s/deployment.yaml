apiVersion: apps/v1
kind: Deployment
metadata:
  name: uim-keppel-service
  namespace: uim-keppel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uim-keppel-service
  template:
    metadata:
      labels:
        app: uim-keppel-service
    spec:
      containers:
      - name: keppel
        image: uim-keppel-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9312
        envFrom:
        - configMapRef:
            name: keppel-service-config
        volumeMounts:
        - name: catalog-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 9312
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 9312
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: catalog-data
        emptyDir: {}
